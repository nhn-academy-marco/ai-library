# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      #    - name: Update dependency graph
      #      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

      #    - uses: actions/checkout@v4
      - name: upload file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID}}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "target/library.jar"
          target: "~/library"
          rm: false

      # 비밀값은 GitHub Secrets에서 받아 서버의 ~/library/secrets.properties 로 생성 (권한 600)
      # 애플리케이션은 spring.config.import 로 이 파일을 읽습니다.
      - name: run-script
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIBRARY_API_KEY: ${{ secrets.LIBRARY_API_KEY }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID}}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DB_PASSWORD,GEMINI_API_KEY,LIBRARY_API_KEY,RABBITMQ_PASSWORD,REDIS_PASSWORD,TELEGRAM_BOT_TOKEN
          script: |
            mkdir -p ~/library
            umask 077
            {
              printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
              printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
              printf 'LIBRARY_API_KEY=%s\n' "$LIBRARY_API_KEY"
              printf 'RABBITMQ_PASSWORD=%s\n' "$RABBITMQ_PASSWORD"
              printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
              printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            } > ~/library/secrets.properties
            chmod 600 ~/library/secrets.properties
            ./library/startup.sh