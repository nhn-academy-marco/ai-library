# ===============================
# Test Datasource / JPA
# ===============================
# 실제 접속 정보는 TestcontainersInitializer가 테스트마다 띄우는 일회용 컨테이너로 덮어씁니다.
# (src/test/java/net/java21/library/support/TestcontainersInitializer.java)
# 아래 URL은 초기화기가 적용되지 않았을 때 원격 DB로 연결되지 않도록 둔 안전장치입니다.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:1/not-configured
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.open-in-view=false
# 일회용 컨테이너이므로 테스트에서만 스키마를 자동 생성합니다. 공용 DB에는 절대 사용하지 않습니다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Disable AI services for tests
# ===============================
spring.ai.openai.base-url=http://localhost:8080
spring.ai.openai.api-key=test-key
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.google.genai.api-key=test-key
spring.ai.google.genai.project-id=test-project
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.selected-model=ollama

# ===============================
# Disable retry for tests
# ===============================
spring.ai.retry.on-client-errors=false
spring.ai.retry.max-attempts=1

# ===============================
# Disable scheduler for tests
# ===============================
scheduler.embedding.enabled=false
# 테스트에서는 표지 보강(실제 API 호출)을 끕니다
cover.enrichment.enabled=false

# ===============================
# Import external configurations
# ===============================
spring.config.import=classpath:rabbitmq.properties,optional:file:./secrets.properties
